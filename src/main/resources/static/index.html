<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Projetos</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;color:#1f2937}
  h1{font-size:1.5rem}
  form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:.5rem;align-items:end;margin-bottom:1rem}
  label{display:flex;flex-direction:column;font-size:.85rem;gap:.25rem}
  input{padding:.45rem;border:1px solid #9ca3af;border-radius:4px}
  button{padding:.5rem 1rem;background:#2563eb;color:#fff;border:0;border-radius:4px;cursor:pointer}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:.5rem;border-bottom:1px solid #e5e7eb}
  #msg{padding:.6rem;border-radius:4px;margin-bottom:1rem;display:none}
  #msg.erro{display:block;background:#fee2e2;color:#991b1b}
  #msg.ok{display:block;background:#dcfce7;color:#166534}
  @media(max-width:600px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Projetos</h1>
<div id="msg" role="alert"></div>
<form id="form">
  <label>Descrição <input name="descricao"></label>
  <label>Início <input type="date" name="dataInicio"></label>
  <label>Fim <input type="date" name="dataFim"></label>
  <button>Adicionar</button>
</form>
<table>
  <thead><tr><th>ID</th><th>Descrição</th><th>Início</th><th>Fim</th></tr></thead>
  <tbody id="lista"></tbody>
</table>
<script>
const msg = document.getElementById('msg');
const mostrar = (texto, tipo) => { msg.textContent = texto; msg.className = tipo; };
const fmt = d => d ? d.split('-').reverse().join('/') : '—';

async function carregar() {
  const r = await fetch('/projetos');
  const projetos = await r.json();
  document.getElementById('lista').replaceChildren(...projetos.map(p => {
    const tr = document.createElement('tr');
    [p.id, p.descricao, fmt(p.dataInicio), fmt(p.dataFim)].forEach(v => {
      const td = document.createElement('td'); td.textContent = v; tr.append(td);
    });
    return tr;
  }));
}

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const dados = Object.fromEntries(new FormData(e.target));
  if (!dados.dataFim) delete dados.dataFim;
  if (!dados.dataInicio) delete dados.dataInicio;
  const r = await fetch('/projetos', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(dados)});
  if (r.ok) {
    e.target.reset(); mostrar('Projeto cadastrado com sucesso', 'ok'); carregar();
  } else {
    const erro = await r.json();
    mostrar([erro.mensagem, ...(erro.erros || [])].join(' — '), 'erro');
  }
});
carregar();
</script>
</body>
</html>
